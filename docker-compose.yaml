services:
  serverapp:
    build: .
    container_name: g-mind
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gmind
      - JWT_SECRET="your_jwt_secret_ket"
      - NODE_ENV=development
      - PORT=5000
      - apiKey="your_apikey_here"
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - .:/serverapp

  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gmind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: